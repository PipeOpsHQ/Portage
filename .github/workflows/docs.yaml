name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Canonical site is MkDocs Material via deploy-pages@v4.
# Settings → Pages → Source must be "GitHub Actions". Deploy from a
# branch (main /docs) is Jekyll and overrides Material. configure-pages
# does not switch an already-enabled legacy site; we PUT build_type.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null || true
          type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)
          echo "pages build_type=${type}"
          if [ "$type" != "workflow" ]; then
            echo "::error::GitHub Pages is ${type} (Jekyll /docs). Set Settings → Pages → Source to GitHub Actions so MkDocs can deploy."
            exit 1
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs
        run: pip install -r requirements-docs.txt
      - name: Build
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
