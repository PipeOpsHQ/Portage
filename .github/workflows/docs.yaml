name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Canonical site is MkDocs Material via deploy-pages@v4.
# Repo Settings → Pages must be "GitHub Actions". A branch source of
# main /docs is Jekyll and overrides this workflow (install.html 200,
# generator Jekyll v3, no Material theme). configure-pages flips that.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs
        run: pip install -r requirements-docs.txt
      - name: Build
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
