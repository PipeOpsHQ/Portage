apiVersion: apps/v1
kind: Deployment
metadata:
  name: portage-controller
  namespace: portage-system
  labels:
    app.kubernetes.io/name: portage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portage
    spec:
      serviceAccountName: portage-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/pipeopshq/portage:dev
          args:
            - --leader-elect
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: PORTAGE_STORE_DIR
              value: /store
          volumeMounts:
            - name: store
              mountPath: /store
      volumes:
        - name: store
          emptyDir: {}
