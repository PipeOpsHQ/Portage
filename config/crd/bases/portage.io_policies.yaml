
---
apiVersion: apiextensions.k8s.io/v1beta1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.3.0
  creationTimestamp: null
  name: policies.portage.io
spec:
  additionalPrinterColumns:
  - JSONPath: .spec.clusterPair
    name: Pair
    type: string
  - JSONPath: .status.phase
    name: Phase
    type: string
  - JSONPath: .status.backupHealthy
    name: Backup
    type: boolean
  - JSONPath: .metadata.creationTimestamp
    name: Age
    type: date
  group: portage.io
  names:
    kind: Policy
    listKind: PolicyList
    plural: policies
    shortNames:
    - ppol
    singular: policy
  scope: Namespaced
  subresources:
    status: {}
  validation:
    openAPIV3Schema:
      description: Policy is the desired backup / replicate / restore / cutover contract
        for a set of workloads.
      properties:
        apiVersion:
          description: 'APIVersion defines the versioned schema of this representation
            of an object. Servers should convert recognized schemas to the latest
            internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
          type: string
        kind:
          description: 'Kind is a string value representing the REST resource this
            object represents. Servers may infer this from the endpoint the client
            submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
          type: string
        metadata:
          type: object
        spec:
          description: PolicySpec is the desired continuity for a set of workloads.
          properties:
            backup:
              description: BackupSpec is the backup half of a Policy. Backup is a
                safety net, not cutover.
              properties:
                enabled:
                  default: true
                  type: boolean
                requireUseful:
                  default: true
                  description: RequireUseful refuses to mark BackupHealthy if artifacts
                    fail usefulness checks (size floor, dump shape). Default true.
                  type: boolean
                rpo:
                  description: RPO is the target backup interval, e.g. "24h".
                  type: string
              type: object
            clusterPair:
              description: ClusterPair is a cluster-scoped pair. Empty means in-cluster
                (source = destination = local).
              type: string
            cutover:
              description: CutoverSpec controls planned failover / cloud hop.
              properties:
                holdSource:
                  description: HoldSource is how long to keep the source frozen-but-present
                    for rollback.
                  type: string
                trafficHook:
                  description: 'TrafficHook names how to switch ingress/DNS. Empty
                    means no traffic move (data-only promote). Implementations: webhook
                    URL, or in-tree later.'
                  type: string
              type: object
            moverOverrides:
              additionalProperties:
                type: string
              description: 'MoverOverrides pins a mover name per WorkloadClass (e.g.
                SQLLogical: postgres-streaming).'
              type: object
            renderer:
              description: RendererSpec chooses dest manifest production.
              properties:
                git:
                  description: Git is used when Kind=Git.
                  properties:
                    path:
                      type: string
                    ref:
                      type: string
                    url:
                      type: string
                  required:
                  - url
                  type: object
                kind:
                  default: Sanitize
                  description: RendererKind selects how destination manifests are
                    produced.
                  enum:
                  - Sanitize
                  - Git
                  - Webhook
                  type: string
                webhookURL:
                  description: WebhookURL is required when Kind=Webhook.
                  type: string
              type: object
            replicate:
              description: ReplicateSpec is continuous or scheduled volume/app replication
                to the dest.
              properties:
                enabled:
                  type: boolean
                rpo:
                  description: RPO is the target lag, e.g. "15m".
                  type: string
              type: object
            restore:
              description: RestoreSpec controls in-place and remote restore.
              properties:
                auto:
                  description: Auto starts a Restore Action when a covered PVC/namespace
                    is empty and a useful artifact exists. Default false — production
                    must opt in.
                  type: boolean
                neverOverwriteNewer:
                  default: true
                  description: NeverOverwriteNewer refuses restore if live data is
                    newer than the artifact.
                  type: boolean
              type: object
            selector:
              description: TargetSelector chooses which workloads a Policy covers.
              properties:
                labelSelector:
                  description: LabelSelector restricts to objects carrying these labels.
                  properties:
                    matchExpressions:
                      description: matchExpressions is a list of label selector requirements.
                        The requirements are ANDed.
                      items:
                        description: A label selector requirement is a selector that
                          contains values, a key, and an operator that relates the
                          key and values.
                        properties:
                          key:
                            description: key is the label key that the selector applies
                              to.
                            type: string
                          operator:
                            description: operator represents a key's relationship
                              to a set of values. Valid operators are In, NotIn, Exists
                              and DoesNotExist.
                            type: string
                          values:
                            description: values is an array of string values. If the
                              operator is In or NotIn, the values array must be non-empty.
                              If the operator is Exists or DoesNotExist, the values
                              array must be empty. This array is replaced during a
                              strategic merge patch.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                        required:
                        - key
                        - operator
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                    matchLabels:
                      additionalProperties:
                        type: string
                      description: matchLabels is a map of {key,value} pairs. A single
                        {key,value} in the matchLabels map is equivalent to an element
                        of matchExpressions, whose key field is "key", the operator
                        is "In", and the values array contains only "value". The requirements
                        are ANDed.
                      type: object
                  type: object
                namespaces:
                  description: Namespaces on the source cluster. Empty means the Policy's
                    own namespace mapped onto the source cluster.
                  items:
                    type: string
                  type: array
              type: object
          type: object
        status:
          description: PolicyStatus is observed inventory and health.
          properties:
            artifacts:
              items:
                description: ArtifactHealth is usefulness of the latest backup for
                  one workload.
                properties:
                  lastBackupTime:
                    format: date-time
                    type: string
                  message:
                    type: string
                  sizeBytes:
                    format: int64
                    type: integer
                  useful:
                    type: boolean
                  workload:
                    type: string
                required:
                - useful
                - workload
                type: object
              type: array
            backupHealthy:
              description: BackupHealthy is false if any stateful workload lacks a
                useful artifact.
              type: boolean
            conditions:
              items:
                description: "Condition contains details for one aspect of the current
                  state of this API Resource. --- This struct is intended for direct
                  use as an array at the field path .status.conditions.  For example,
                  \n \ttype FooStatus struct{ \t    // Represents the observations
                  of a foo's current state. \t    // Known .status.conditions.type
                  are: \"Available\", \"Progressing\", and \"Degraded\" \t    // +patchMergeKey=type
                  \t    // +patchStrategy=merge \t    // +listType=map \t    // +listMapKey=type
                  \t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                  patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`
                  \n \t    // other fields \t}"
                properties:
                  lastTransitionTime:
                    description: lastTransitionTime is the last time the condition
                      transitioned from one status to another. This should be when
                      the underlying condition changed.  If that is not known, then
                      using the time when the API field changed is acceptable.
                    format: date-time
                    type: string
                  message:
                    description: message is a human readable message indicating details
                      about the transition. This may be an empty string.
                    maxLength: 32768
                    type: string
                  observedGeneration:
                    description: observedGeneration represents the .metadata.generation
                      that the condition was set based upon. For instance, if .metadata.generation
                      is currently 12, but the .status.conditions[x].observedGeneration
                      is 9, the condition is out of date with respect to the current
                      state of the instance.
                    format: int64
                    minimum: 0
                    type: integer
                  reason:
                    description: reason contains a programmatic identifier indicating
                      the reason for the condition's last transition. Producers of
                      specific condition types may define expected values and meanings
                      for this field, and whether the values are considered a guaranteed
                      API. The value should be a CamelCase string. This field may
                      not be empty.
                    maxLength: 1024
                    minLength: 1
                    pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                    type: string
                  status:
                    description: status of the condition, one of True, False, Unknown.
                    enum:
                    - "True"
                    - "False"
                    - Unknown
                    type: string
                  type:
                    description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      --- Many .condition.type values are consistent across resources
                      like Available, but because arbitrary conditions can be useful
                      (see .node.status.conditions), the ability to deconflict is
                      important. The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                    maxLength: 316
                    pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                    type: string
                required:
                - lastTransitionTime
                - message
                - reason
                - status
                - type
                type: object
              type: array
            inventory:
              items:
                description: InventoryItem is one classified workload.
                properties:
                  class:
                    description: WorkloadClass is how Portage treats a discovered
                      workload.
                    enum:
                    - Stateless
                    - GenericPVC
                    - SQLLogical
                    - KVLogical
                    - SearchFS
                    - QueueDurable
                    - ObjectStore
                    - OperatorManaged
                    - UnknownStateful
                    type: string
                  engine:
                    type: string
                  kind:
                    type: string
                  mover:
                    description: Mover is the selected mover name, if any.
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                  pvcNames:
                    description: PVCNames are claims that hold this workload's state.
                    items:
                      type: string
                    type: array
                  unclassified:
                    description: Unclassified is true when Class=UnknownStateful —
                      still backed up, but noisy.
                    type: boolean
                required:
                - class
                - kind
                - name
                - namespace
                type: object
              type: array
            message:
              type: string
            observedGeneration:
              format: int64
              type: integer
            phase:
              description: PolicyPhase is rollup health for a Policy.
              type: string
            replicaLag:
              description: ReplicaLag is a human-readable lag summary when replicate
                is enabled.
              type: string
          type: object
      type: object
  version: v1alpha1
  versions:
  - name: v1alpha1
    served: true
    storage: true
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: []
