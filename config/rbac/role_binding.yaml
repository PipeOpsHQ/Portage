apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portage-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portage-manager-role
subjects:
  - kind: ServiceAccount
    name: portage-controller
    namespace: portage-system
