  - clusterpairs
  - policies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - portage.io
  resources:
  - actions/status
  - clusterpairs/status
  - policies/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - portage.io
  resources:
  - plugins
