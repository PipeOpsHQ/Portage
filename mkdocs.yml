site_name: Portage by PipeOps
site_description: Kubernetes workload mobility — classify, replicate, restore, cut over.
site_url: https://pipeopshq.github.io/Portage/
repo_url: https://github.com/PipeOpsHQ/Portage
repo_name: PipeOpsHQ/Portage
edit_uri: edit/main/docs/
copyright: Copyright 2026 PipeOps and the Portage Authors. Apache-2.0.
docs_dir: docs
strict: true

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Light mode
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PipeOpsHQ/Portage
    - icon: fontawesome/brands/golang
      link: https://pkg.go.dev/github.com/PipeOpsHQ/portage

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Install: install.md
  - Concepts: concepts.md
  - CRDs: crds.md
  - Backup & restore: backup-restore.md
  - Replication & cutover: cutover.md
  - Configuration: configuration.md
  - CLI: cli.md
  - E2e: e2e.md
  - Architecture: architecture.md
  - Contributing: contributing.md
